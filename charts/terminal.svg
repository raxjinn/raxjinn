<svg xmlns="http://www.w3.org/2000/svg" width="520" height="306" viewBox="0 0 520 306" role="img" aria-label="Terminal readout of stack and focus">
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#791e94"/><stop offset=".5" stop-color="#f6019d"/>
    <stop offset="1" stop-color="#2de2e6"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#791e94" stop-opacity="0"/>
    <stop offset=".5" stop-color="#f6019d"/>
    <stop offset="1" stop-color="#2de2e6" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
  </pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  @keyframes bl { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes ledup { 0% { opacity: .15; } 100% { opacity: .85; } }
  #beam { animation: sweep 6s linear infinite; }
  .led { opacity: .85; animation: ledup .5s ease-out both; }

  @keyframes rowin { 0% { opacity: 0; transform: translateX(-8px); } 100% { opacity: 1; transform: translateX(0); } }
  #cur { animation: bl 1.1s steps(1) infinite; }
  #row0 { animation: rowin .35s ease-out 0.50s both; }
  #row1 { animation: rowin .35s ease-out 0.66s both; }
  #row2 { animation: rowin .35s ease-out 0.82s both; }
  #row3 { animation: rowin .35s ease-out 0.98s both; }
  #row4 { animation: rowin .35s ease-out 1.14s both; }
  #row5 { animation: rowin .35s ease-out 1.30s both; }
  #row6 { animation: rowin .35s ease-out 1.46s both; }
  #row7 { animation: rowin .35s ease-out 1.62s both; }
  #prompt { animation: rowin .3s ease-out 1.98s both; }
  @media (prefers-reduced-motion: reduce) {
    #beam, #cur, .led, #prompt, [id^="row"] { animation: none; opacity: 1; transform: none; }
  }
</style>
<rect width="520" height="306" rx="12" fill="#0d0221"/>
<rect width="520" height="306" rx="12" fill="url(#scan)"/>
<g clip-path="inset(0 round 12px)">
  <rect id="beam" x="0" y="0" width="520" height="3" fill="url(#edge)"/>
</g>
<text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7d6f9c">~/evan -- zsh</text>
<circle class="led" cx="470" cy="25" r="5" fill="#ff3864"/>
<circle class="led" cx="486" cy="25" r="5" fill="#f6019d"/>
<circle class="led" cx="502" cy="25" r="5" fill="#2de2e6"/>
<rect x="1.5" y="1.5" width="517" height="303" rx="11" fill="none"
      stroke="#791e94" stroke-opacity=".5"/>
<text x="20" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2de2e6"><tspan fill="#f6019d">$</tspan> neofetch</text>
<g id="row0"><rect x="20" y="72" width="8" height="8" fill="#791e94"/><text x="38" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7d6f9c">focus</text><text x="112" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e6e1ff">medical imaging pipelines</text></g>
<g id="row1"><rect x="20" y="94" width="8" height="8" fill="#791e94"/><text x="38" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7d6f9c">stack</text><text x="112" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e6e1ff">C# / .NET, Python, TypeScript</text></g>
<g id="row2"><rect x="20" y="116" width="8" height="8" fill="#791e94"/><text x="38" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7d6f9c">data</text><text x="112" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e6e1ff">PostgreSQL, DICOM, HL7v2</text></g>
<g id="row3"><rect x="20" y="138" width="8" height="8" fill="#791e94"/><text x="38" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7d6f9c">editor</text><text x="112" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e6e1ff">Neovim, Visual Studio</text></g>
<g id="row4"><rect x="20" y="160" width="8" height="8" fill="#791e94"/><text x="38" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7d6f9c">shell</text><text x="112" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e6e1ff">pwsh, bash</text></g>
<g id="row5"><rect x="20" y="182" width="8" height="8" fill="#791e94"/><text x="38" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7d6f9c">motto</text><text x="112" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e6e1ff">boring code, loud alerts</text></g>
<g id="row6"><rect x="20" y="204" width="8" height="8" fill="#791e94"/><text x="38" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7d6f9c">uptime</text><text x="112" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e6e1ff">7.2 years on github</text></g>
<g id="row7"><rect x="20" y="226" width="8" height="8" fill="#791e94"/><text x="38" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7d6f9c">public</text><text x="112" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e6e1ff">3 repos</text></g>
<g id="prompt"><text x="20" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2de2e6"><tspan fill="#f6019d">$</tspan> <tspan id="cur" fill="#f6019d">&#9608;</tspan></text></g>
</svg>
