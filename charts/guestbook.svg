<svg xmlns="http://www.w3.org/2000/svg" width="520" height="158" viewBox="0 0 520 158" role="img" aria-label="Visitor guestbook, 0 signed">
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#791e94"/><stop offset=".5" stop-color="#f6019d"/>
    <stop offset="1" stop-color="#2de2e6"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#791e94" stop-opacity="0"/>
    <stop offset=".5" stop-color="#f6019d"/>
    <stop offset="1" stop-color="#2de2e6" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
  </pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  @keyframes bl { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes ledup { 0% { opacity: .15; } 100% { opacity: .85; } }
  #beam { animation: sweep 6s linear infinite; }
  .led { opacity: .85; animation: ledup .5s ease-out both; }

  @keyframes popin { 0% { opacity: 0; transform: translateY(10px) scale(.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    #beam, .led, [id^="tile"] { animation: none; opacity: 1; transform: none; }
  }
</style>
<rect width="520" height="158" rx="12" fill="#0d0221"/>
<rect width="520" height="158" rx="12" fill="url(#scan)"/>
<g clip-path="inset(0 round 12px)">
  <rect id="beam" x="0" y="0" width="520" height="3" fill="url(#edge)"/>
</g>
<text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7d6f9c">guestbook -- 0 signed</text>
<circle class="led" cx="470" cy="25" r="5" fill="#ff3864"/>
<circle class="led" cx="486" cy="25" r="5" fill="#f6019d"/>
<circle class="led" cx="502" cy="25" r="5" fill="#2de2e6"/>
<rect x="1.5" y="1.5" width="517" height="155" rx="11" fill="none"
      stroke="#791e94" stroke-opacity=".5"/>
<text x="260" y="87" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#7d6f9c">no signatures yet -- open an issue</text>
</svg>
