name: charts

on:
  schedule:
    - cron: "0 13 * * *"   # 06:00 America/Phoenix
  workflow_dispatch:

permissions:
  contents: write

env:
  # Synthwave. Applied to every metrics card so they read as one system.
  THEME_CSS: |
    svg { background: #0d0221 !important; border-radius: 10px; }
    h2 { color: #2de2e6 !important; text-shadow: 0 0 6px rgba(45,226,230,.55); letter-spacing: .04em; }
    .field, .value, text, span, div { color: #e6e1ff !important; }
    .gray, .subtitle { color: #7d6f9c !important; }
    svg .bar, svg rect.bar { filter: drop-shadow(0 0 3px rgba(246,1,157,.7)); }
    [fill="#ebedf0"] { fill: #1a1033 !important; }
    [fill="#9be9a8"] { fill: #4a1f7a !important; }
    [fill="#40c463"] { fill: #791e94 !important; }
    [fill="#30a14e"] { fill: #f6019d !important; }
    [fill="#216e39"] { fill: #2de2e6 !important; }

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Contribution isocalendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: raxjinn
          filename: charts/calendar.svg
          base: ""
          config_timezone: America/Phoenix
          extras_css: ${{ env.THEME_CSS }}
          optimize: xml
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: WakaTime (languages / editors / os -- projects section omitted)
        uses: lowlighter/metrics@v3.34
        with:
          token: NOT_NEEDED
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: raxjinn
          filename: charts/wakatime.svg
          base: ""
          config_timezone: America/Phoenix
          extras_css: ${{ env.THEME_CSS }}
          optimize: xml
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_url: https://wakatime.com
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, languages, languages-graphs, editors, os

  cards:
    # Serialized behind metrics: both jobs commit to master, and in parallel they
    # race each other's push. The snake job targets the output branch, so it is free.
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python .github/scripts/render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/
          if git diff --quiet --cached; then echo "no card changes"; exit 0; fi
          git commit -m "chore: refresh animated cards"
          git pull --rebase --autostash origin master
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3.5.0
        id: snake
        with:
          github_user_name: raxjinn
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23f6019d&color_dots=%230d0221,%23791e94,%23f6019d,%23ff3864,%232de2e6

      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
